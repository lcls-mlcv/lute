%YAML 1.3
---
title: "LUTE Task Configuration" # Include experiment description if desired
experiment: "{{ $EXPERIMENT }}"
#run: "{{ $RUN_NUM }}"
date: "2023/10/25"
lute_version: 0.3.0      # Do not be change unless need to force older version
task_timeout: 6000
work_dir: ""

# Setup RUN_GROUPS once globally - Give you semantic range of runs
# In the Tasks, you define parameter policies
# Setting run to 9999 includes all runs. This is the largest LCLS run supported.
RUN_GROUPS:
  ALL_RUNS:
    applies_to:
      # Bounds are inclusive
      range: [0, 9999]
      # Alternatively, your group can use an explicit list
      # runs: [1, 2, 3, 4]
...
---
###########
# Smalldata
###########

# Producer will be auto-determined. Set only if you have a separate install
# Set `directory` if you want to write to a different folder
# For out of memory issues try setting gather_interval
SubmitSMD:
  # Choose RUN_GROUPS policies
  RUN_GROUPS:
    ALL_RUNS: # Matches name above
      # `default` applies to all the parameters
      default: @literal
      # Alternatives:
      # default: @db:current # Use the last value for current run, in database
      # default: @db:run:1   # Use the value for run 1, in database. Can choose any run
      #
      # Can also setup a policy for each parameter, including with nesting
      # Use the last value for ROIs for the current run
      # producer_parameters.getROIs: @db:current
      # Use the run 1 value just for jungfrau
      # producer_parameters.getROIs.jungfrau: @db:run:1

  # Command line arguments
  #map_by: "core"   # MPI resource mapping - take care with changing unless familiar
  #bind_to: "core"  # MPI resource binding - take care with changing unless familiar
  # LCLS1 (psana1)
  producer: "{{ work_dir }}/smalldata_tools/lcls1_producers/smd_producer.py"
  lute_template_cfg:
    template_name: "smd1_prod_config_template.py"
    output_path: "{{ work_dir }}/smalldata_tools/lcls1_producers/prod_config_mec.py"
  #run: 99
  #experiment: ""
  #stn: 0
  #directory: ""
  #config: "mfx_cctbx"
  #gather_interval: 25
  #norecorder: False
  #url: "https://pswww.slac.stanford.edu"
  #epicsAll: False
  #full: False
  #fullSum: False
  #default: true
  #image: False
  #tiff: False
  #centerpix: False
  #postRuntable: False
  #wait: False
  #xtcav: False
  #noarch: False
  # Producer variables. These are substituted into the producer to run specific
  # data reduction algorithms. Uncomment and modify as needed.
  # If you prefer to modify the producer file directly, leave commented.
  # Beginning with `getROIs`, you will need to modify the first entry to be a
  # detector. This detector MUST MATCH one of the detectors in `detnames`.
  # In the future this will be automated. If you have multiple detectors you can
  # add them with their own set of parameters.
  producer_parameters:
    detnames: ["Epix10kaQuad0", "Epix10kaQuad1", "Epix10kaQuad2", "Epix10kaQuad3"]
    #epicsPV: []
    #epicsOncePV: []
    #ttCalib: []
    # Provide detector image sum algorithms.
    # If detSumAlgos is not defined, it will default to calib, calib_dropped and
    # calib_dropped_square for every detector. You can add processing algorithms for
    # single detectors (e.g. epix10k2M or Rayonix) as below, or add algorithms which
    # will apply to every detector defined in detnames by placing them under "all"
    detSumAlgos:
      all:
        - "calib"
        - "calib_dropped"
        - "calib_dropped_square"
        - "calib_thresADU1"
        - "calib_max"
