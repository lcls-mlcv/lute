###########
# BayFAI
###########

# Base/default BayFAI parameters (used as a template when BayFAI runs as a
# single Task). To run BayFAI on all 4 Quads in parallel, use a `!param_sweep`
# with `zip: true` in the DAG (see dag.yaml) - the per-quad detname/center/
# fixed/calibrant values below are collected there instead of being repeated
# as separate commented-out blocks here.
BayFAI:
  fixed:
  - "rot1"
  - "rot3"
  center:
    dist: 0.27                # Fill this section with rough estimates
    poni1: 0.06
    poni2: 0.06
    rot1: 0.0
    rot2: -0.6
    rot3: 0.0
  bounds:                     # absolute [low, high] limits, not offsets around center
    dist: [0.26, 0.28]
    poni1: [0.05, 0.07]
    poni2: [0.05, 0.07]
    rot1: [-0.1, 0.1]
    rot2: [-0.7, -0.5]
    rot3: [-0.1, 0.1]
  resolutions:
    dist: 0.001
    poni1: 0.0005
    poni2: 0.0005
    rot1: 0.01
    rot2: 0.01
    rot3: 0.01
  calibrant: "CeO2"           # Fill this line with calibrant name (CeO2, LaB6...)
  detname: "Epix10kaQuad0"
...
