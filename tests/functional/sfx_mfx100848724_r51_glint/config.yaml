%YAML 1.3
---
title: "SFX GLINT test: mfx100848724 r51"
experiment: "mfx100848724"
run: 51
date: "2026/09/24"
lute_version: 0.3.0      # Do not be change unless need to force older version
task_timeout: 30000
work_dir: "/tmp"
...
---
FindPeaksSFX:
    outdir: "{{ work_dir }}/sfx_mfx100848724_r51_glint_peaks"
    out_file: "{{ work_dir }}/sfx_mfx100848724_r51_glint_peaks/sfx_mfx100848724_r51_glint.list"
    tag: "sfx_mfx100848724_r51_glint"
    det_name: "jungfrau"
    event_receiver: "evr0"
    event_logic: false
    psana_mask: false
    mask_file: null
    min_peaks: 10
    max_peaks: 2048
    npix_min: 2
    npix_max: 30
    amax_thr: 1000
    son_min: 5.0
    peak_rank: 3
    r0: 4.0
    dr: 2.0
    nsigm: 10.0
    pv_camera_length: 0.0   # the .geom carries a numeric clen
    n_events: 12000
    geometry_file: "/sdf/group/lcls/ds/tools/lute/test_utilities/sfx/mfx100848724_356mm_refined.geom"
    make_powder_plots: false

IndexGLINT:
    images: "{{ work_dir }}/sfx_mfx100848724_r51_glint_peaks/sfx_mfx100848724_r51_glint.list"
    peakfinder: "stored"     # reuse FindPeaksSFX's peakfinder8 peaks
    geom: "/sdf/group/lcls/ds/tools/lute/test_utilities/sfx/mfx100848724_356mm_refined.geom"
    out: "{{ work_dir }}/mfx100848724_r51_orientations.stream"   # not *sfx_mfx100848724_r51_glint*: kept out of the merge
    tofile: "{{ work_dir }}/mfx100848724_r51_glint.sol"   # orientations for CrystFEL (--indexing=file)
    lattice: "tPc"
    nbest: 3
    gate: "strict"        # write only frames that pass the strict bar (GLINT --gate)
    device: "auto"
    cell: "79.17 79.17 37.96 90.00 90.00 90.00"

IndexCrystFEL:
    in_file: "{{ work_dir }}/sfx_mfx100848724_r51_glint_peaks/sfx_mfx100848724_r51_glint.list"
    out_file: "{{ work_dir }}/sfx_mfx100848724_r51_glint.stream"
    geometry: "/sdf/group/lcls/ds/tools/lute/test_utilities/sfx/mfx100848724_356mm_refined.geom"
    indexing: "file"          # GLINT's orientations; CrystFEL refines, checks the cell, integrates
    fromfile_input_file: "{{ work_dir }}/mfx100848724_r51_glint.sol"
    tolerance: "10,10,10,3"
    peaks: "cxi"
    int_radius: "3,4,6"
    cell_file: "/sdf/group/lcls/ds/tools/lute/test_utilities/sfx/lyso_tetragonal_p43212.cell"

ConcatenateStreamFiles:
    in_file: "{{ work_dir }}"
    tag: "sfx_mfx100848724_r51_glint"
    out_file: "{{ work_dir }}/mfx100848724_r51_glint_all.stream"

MergePartialator:
    in_file: "{{ work_dir }}/mfx100848724_r51_glint_all.stream"
    out_file: "{{ work_dir }}/mfx100848724_r51_glint.hkl"
    symmetry: "4/mmm"
    model: "unity"

CompareHKL:
    cell_file: "/sdf/group/lcls/ds/tools/lute/test_utilities/sfx/lyso_tetragonal_p43212.cell"
    symmetry: "4/mmm"
    fom: "CC"            # overall CC1/2: the pass criterion (README)

ManipulateHKL:
    cell_file: "/sdf/group/lcls/ds/tools/lute/test_utilities/sfx/lyso_tetragonal_p43212.cell"
...
