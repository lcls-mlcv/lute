    max_peaks: 2048
    npix_min: 2
    npix_max: 30
    amax_thr: 300
    son_min: 5.0
    peak_rank: 3
    r0: 3.0
    dr: 2.0
    nsigm: 10.0
    pv_camera_length: 0.0   # the .geom carries a numeric clen
    n_events: 3000
    geometry_file: "/sdf/group/lcls/ds/tools/lute/test_utilities/sfx/mfxl1038923_r0058.geom"
    make_powder_plots: false

IndexCrystFEL:
    in_file: "{{ work_dir }}/sfx_mfxl1038923_r58_crystfel_peaks/sfx_mfxl1038923_r58_crystfel.list"
    out_file: "{{ work_dir }}/sfx_mfxl1038923_r58_crystfel.stream"
