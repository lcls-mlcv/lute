%YAML 1.3
---
title: "SFX CrystFEL test: mfxl1038923 r58"
experiment: "mfxl1038923"
run: 58
date: "2026/09/24"
lute_version: 0.3.0      # Do not be change unless need to force older version
task_timeout: 30000
work_dir: "/tmp"
...
---
FindPeaksSFX:
    outdir: "{{ work_dir }}/sfx_mfxl1038923_r58_crystfel_peaks"
    out_file: "{{ work_dir }}/sfx_mfxl1038923_r58_crystfel_peaks/sfx_mfxl1038923_r58_crystfel.list"
    tag: "sfx_mfxl1038923_r58_crystfel"
    det_name: "epix10k2M"
    event_receiver: "evr0"
    psana_version: 1
    event_logic: false
    psana_mask: false
    mask_file: null
