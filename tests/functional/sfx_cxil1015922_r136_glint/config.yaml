    fromfile_input_file: "{{ work_dir }}/cxil1015922_r136_glint.sol"
    tolerance: "10,10,10,3"
    peaks: "cxi"
    int_radius: "3,4,6"
    cell_file: "/sdf/group/lcls/ds/tools/lute/test_utilities/sfx/cxil1015922_b2.cell"

ConcatenateStreamFiles:
    in_file: "{{ work_dir }}"
