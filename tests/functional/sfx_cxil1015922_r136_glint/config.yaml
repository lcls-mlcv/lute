    device: "auto"
    cell: "111.94 172.23 41.23 90.00 106.20 90.00"

IndexCrystFEL:
    in_file: "{{ work_dir }}/sfx_cxil1015922_r136_glint_peaks/sfx_cxil1015922_r136_glint.list"
    out_file: "{{ work_dir }}/sfx_cxil1015922_r136_glint.stream"
    geometry: "/sdf/group/lcls/ds/tools/lute/test_utilities/sfx/cxil1015922_r0136_b2.geom"
