    tag: "sfx_cxil1015922_r136_glint"
    det_name: "jungfrau4M"
    event_receiver: "evr0"
    psana_version: 1
    event_logic: false
    psana_mask: false
    mask_file: null
    min_peaks: 10
    max_peaks: 2048
    npix_min: 2
    npix_max: 30
    amax_thr: 200
    son_min: 6.0
    peak_rank: 3
    r0: 3.0
    dr: 2.0
    nsigm: 10.0
    pv_camera_length: 0.0   # the .geom carries a numeric clen
