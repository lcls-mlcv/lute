plugins:
- search
#- gen-files:
#    scripts:
#    - scripts/gen_ref_pages.py
- mkdocstrings:
    enabled: !ENV [ENABLE_MKDOCSTRINGS, true]
    default_handler: python
    handlers:
      python:
        paths: [lute]
        options:
          show_source: true
          filters:
            - "!__author__"
            - "!__all__"
- mike:
    # These fields are all optional; the defaults are as below...
    alias_type: symlink
    redirect_template: null
    deploy_prefix: ''
    canonical_version: dev
    version_selector: true
    css_dir: css
    javascript_dir: js
theme:
  #name: readthedocs
  name: material
